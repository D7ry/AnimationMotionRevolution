[EdgeProtection]
; Enable edge protection for attack animations.
bEnableForAttackAnimations = true
; Allow Page Down to toggle predicted center/boundary and hit/miss rays through
; the optional TrueHUD V3 API.
bDebugDraw = true
; Skyrim world units above the predicted destination where the ray begins.
fRaycastStartHeight = 50.0
; Skyrim world units cast downward from the predicted destination.
; Increasing this range makes the character more likely to move or fall off an edge,
; because lower surfaces are accepted as support. Setting it too small can block the
; character at edges with only a small drop in height.
fRaycastDownwardRange = 200.0
; Ignore extremely small per-frame horizontal steps.
fMinimumHorizontalDelta = 0.10

[MotionWarping]
; Enable default motion warping for attack animations.
; An active animwarp annotation enables warping for its animation regardless of this setting.
bEnableForAttackAnimations = true
; The authored motion direction is never rotated or steered.
; Default scale limits for unannotated attack animations.
fDefaultMinimumScale = 0.0
fDefaultMaximumScale = 1.0
; Default maximum authored-motion-to-target angle for unannotated attack animations.
fDefaultMaximumAngleDegrees = 60.0
; The default behavior therefore clamps scale to 0..1 with a 60-degree angle.
; Timestamped "animwarp lower upper [angle] [distance]" annotations can override these limits.
; Stop this many Skyrim units short of the target. Zero means target the exact position.
fStopDistance = 0.0
; Ignore animations whose authored horizontal motion is shorter than this.
fMinimumAuthoredDistance = 1.0

[Debug]
; spdlog levels: 0 trace, 1 debug, 2 info, 3 warning, 4 error, 5 critical, 6 off.
uLogLevel = 2
