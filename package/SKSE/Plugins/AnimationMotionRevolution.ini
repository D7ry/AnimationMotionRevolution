[RayCast]
; Probe the next horizontal root-motion step by casting straight down on the Z axis.
bEnable = true
; Draw predicted center/boundary and hit/miss rays through the optional TrueHUD V3 API.
bDebugDraw = true
; Skyrim world units above the predicted destination where the ray begins.
fStartHeight = 50.0
; Skyrim world units cast downward from the ray start.
fDownwardLength = 200.0
; Ignore extremely small per-frame horizontal steps.
fMinimumHorizontalDelta = 0.10

[MotionWarping]
; While attacking, scale root-motion distance for the current combat target.
; The authored motion direction is never rotated or steered.
bEnable = true
; Warping only reduces authored horizontal motion; extension is disabled.
; Reduction remains unrestricted and can reach zero.
; Stop this many Skyrim units short of the target. Zero means target the exact position.
fStopDistance = 0.0
; Ignore animations whose authored horizontal motion is shorter than this.
fMinimumAuthoredDistance = 1.0
; Only scale animations already directed roughly toward the target.
fMaximumTargetAngleDegrees = 60.0

[Debug]
; spdlog levels: 0 trace, 1 debug, 2 info, 3 warning, 4 error, 5 critical, 6 off.
uLogLevel = 2
